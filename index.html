<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


</head>

<body>

  <div id="bgOverlay"></div>
  <div id="weatherAnimation"></div>
  <div class="app-header">
    <h1 class="title">🌤 Weather<span>App</span></h1>
    <p class="subtitle">Real-time weather insights</p>
  </div>

  <div class="container">

    <div class="left-section">

      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city..." />
        <button id="searchBtn">Search</button>
      </div>

     
      <button onclick="getWeatherByLocation()" class="location-btn">
        <span class="dot"></span>
        Use My Location
      </button>

      <div id="weatherResult" class="hidden">
        <h2 id="cityName"></h2>
        <img id="weatherIcon" />
        <p>🌡 Temp: <span id="temp"></span>°C</p>
        <p>💧 Humidity: <span id="humidity"></span>%</p>
        <p>🌬 Wind: <span id="wind"></span> km/h</p>
      </div>
    </div>

    <div class="right-section">

      <div id="forecast" class="hidden">
        <h3>5-Day Forecast</h3>
        <div id="forecastContainer"></div>
      </div>

      <p id="error" class="error"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
